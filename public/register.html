<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Ro'yxatdan o'tish — ABU-chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card">
    <a href="/" class="logo" style="display:block; text-align:center; margin-bottom:14px;">ABU-<span>chat</span></a>
    <h1>Ro'yxatdan o'tish</h1>
    <p class="lead">50 ta avto-javob bepul. Kartochka kerak emas.</p>

    <div id="alert"></div>

    <form id="form">
      <label for="full_name">Ismingiz</label>
      <input type="text" id="full_name" autocomplete="name" placeholder="Ism Familiya">

      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="siz@example.com">

      <label for="password">Parol (kamida 6 ta belgi)</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="••••••••">

      <button type="submit" class="btn full" id="submit" style="margin-top:18px;">Akkaunt yaratish</button>
    </form>

    <p class="meta">Akkauntingiz bormi? <a href="/login.html">Kirish</a></p>
    <p class="meta" style="margin-top:6px; font-size:12px;">
      Davom ettirish bilan <a href="/terms_of_service.html">Shartlar</a> va
      <a href="/privacy_policy.html">Maxfiylik siyosati</a>ga rozisiz.
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
  const form = document.getElementById('form');
  const alertBox = document.getElementById('alert');
  const submit = document.getElementById('submit');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    alertBox.innerHTML = '';
    submit.disabled = true; submit.textContent = 'Tekshirilmoqda...';
    try {
      const body = {
        full_name: document.getElementById('full_name').value.trim() || undefined,
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };
      await api.post('/api/auth/register', body);
      location.href = '/dashboard.html';
    } catch (err) {
      let msg = 'Xatolik. Qayta urinib ko\'ring.';
      if (err.payload && err.payload.error === 'email_taken') msg = 'Bu email bilan akkaunt allaqachon bor.';
      if (err.payload && err.payload.error === 'invalid_input') msg = 'Email yoki parol noto\'g\'ri.';
      alertBox.innerHTML = `<div class="alert error">${msg}</div>`;
    } finally {
      submit.disabled = false; submit.textContent = 'Akkaunt yaratish';
    }
  });
</script>
</body>
</html>
